name: owners

# Stand-in for app-foundry's owner check: passes once the PR has any review, as the real check
# passes once an owner approves. It runs on the PR's own events only; owners-rerun re-runs it.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: owners-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  owners:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          reviews=$(gh api "repos/$REPO/pulls/$PR/reviews" --jq length)
          echo "event=$GITHUB_EVENT_NAME attempt=$GITHUB_RUN_ATTEMPT reviews=$reviews"
          [ "$reviews" -gt 0 ]
